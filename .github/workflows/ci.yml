name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test
    # macos-15 ships newer Xcodes; the swift-sdk dependency needs Swift tools 6.1+,
    # so the older default toolchain on macos-14 can't even resolve dependencies.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest available Xcode (Swift 6.1+)
        run: |
          LATEST=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST" ]; then LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); fi
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST"

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  # Python unit suite (#48): no network, no `claude -p` — safe on the PR critical path.
  # This is what makes the front-page vs-context7 guards fire MECHANICALLY at the PR
  # gate: the README-block drift guard (test_emit_readme_block_matches_committed_readme,
  # + the `--emit-readme --check` CLI path) and the chart's SEMANTIC guard
  # (test_committed_svg_is_semantically_faithful — matplotlib-version-independent by
  # design, it re-renders in THIS env and compares <text> content, not bytes).
  # Deliberately NOT run here: `--emit-chart --check` (byte-compare — false-drifts
  # across matplotlib/freetype versions; #50 verify) and the LIVE eval
  # (run_eval.py — real `claude -p` calls; stays periodic/manual per project policy).
  python-tests:
    name: python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install eval-harness dependencies
        run: pip install -r evals/look-up/requirements.txt

      - name: Run unit tests (incl. vs-context7 drift guards)
        run: python3 -m pytest evals/look-up/tests/ -q
