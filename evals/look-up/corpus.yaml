# ── explicit invocation → /livedocs:look-up argument-shape routing (issue #38) ──
# Structural oracles on purpose: the R case's ANSWER TEXT will change when #35
# lands an R runtime adapter (not-resolved degrade → real anchor), so we assert
# "a LiveDocs tool fired + non-empty answer", never golden text.
- id: explicit-lookup-r-en
  prompt: "/livedocs:look-up R"
  lang: en
  category: explicit
  expected_trigger: true
  expected_tools: [introspect]
  # A language token routes to runtime introspection — a wrong kind (cli / r-pkg)
  # fires the same introspect tool; pin kind=runtime to catch a mis-routed kind.
  expected_args:
    introspect: {kind: runtime}
  oracle: {type: structural}

- id: explicit-lookup-pin-en
  prompt: "/livedocs:look-up react@18"
  lang: en
  category: explicit
  expected_trigger: true
  expected_tools: [resolve_source, fetch_docs]
  # resolve_source must carry the parsed name + pin, not a mis-split (issue #38 verify).
  expected_args:
    resolve_source: {library: react, version: "18"}
  oracle: {type: structural}

- id: explicit-lookup-cran-zh
  prompt: "/livedocs:look-up dplyr mutate 用法"
  lang: zh
  category: explicit
  expected_trigger: true
  expected_tools: [resolve_source, fetch_docs]
  # A non-npm/pypi package: the agent MUST name the ecosystem (cran); dropping it
  # fires the same tool but resolves wrong — caught by the arg check (issue #38 verify).
  expected_args:
    resolve_source: {library: dplyr, ecosystem: cran}
  oracle: {type: structural}

- id: explicit-lookup-docs-url-en
  prompt: "/livedocs:look-up https://hono.dev"
  lang: en
  category: explicit
  expected_trigger: true
  expected_tools: [resolve_source, fetch_docs]
  oracle: {type: structural}

- id: explicit-lookup-openapi-url-en
  prompt: "/livedocs:look-up https://petstore3.swagger.io/api/v3/openapi.json"
  lang: en
  category: explicit
  expected_trigger: true
  expected_tools: [introspect]
  # A named openapi.json path is a schema introspection, NOT a CLI/graphql: the
  # kind arg is contract-mandated (SKILL rule 1). introspect firing with the
  # wrong kind slips past the tool-name route check (issue #38 fix verify).
  expected_args:
    introspect: {kind: openapi}
  oracle: {type: structural}

- id: explicit-lookup-js-alias-en
  prompt: "/livedocs:look-up javascript"
  lang: en
  category: explicit
  expected_trigger: true
  expected_tools: [introspect]
  # A language token routes to runtime introspection — a wrong kind (cli/r-pkg)
  # fires the same introspect tool and would pass a name-only route check. We pin
  # kind=runtime (stable) but NOT target: the js→node normalization target value
  # changed across the R-adapter change (node vs passthrough javascript), so a
  # version-stable corpus pins only the invariant kind (issue #38 fix verify).
  expected_args:
    introspect: {kind: runtime}
  oracle: {type: structural}

- id: explicit-lookup-scoped-pin-en
  # last-@ boundary: two @ characters — leading @ is part of the name, the pin
  # is the substring after the LAST @ (issue #38 / PR #34 verify last-@ rule).
  prompt: "/livedocs:look-up @types/node@20"
  lang: en
  category: explicit
  expected_trigger: true
  expected_tools: [resolve_source, fetch_docs]
  # THE last-@ mis-split catcher: library must be the full "@types/node" (leading
  # @ kept, split at the LAST @), version "20". A mis-split (@types / node@20)
  # fires the same resolve_source and slips past the route check (issue #38 verify).
  expected_args:
    resolve_source: {library: "@types/node", version: "20"}
  oracle: {type: structural}

- id: explicit-lookup-crates-pin-en
  # Non-npm/pypi pin: crates registry serves latest — the answer must state the
  # pin was not applied (spec scenario "Version pin outside npm/pypi is
  # surfaced as not applied"). Structural oracle; the not-applied wording is
  # engine/skill behavior asserted by spec review, not golden text here.
  prompt: "/livedocs:look-up serde@1.0.100"
  lang: en
  category: explicit
  expected_trigger: true
  expected_tools: [resolve_source, fetch_docs]
  # Ecosystem (crates) MUST be named — a dropped ecosystem fires the same tool but
  # resolves wrong (the load-bearing catcher). `version` is intentionally NOT
  # asserted: for a non-npm/pypi pin the skill may legitimately omit the version
  # from the call (the registry serves latest and the answer states the pin was
  # not applied), so asserting it would false-fail a contract-correct run
  # (issue #38 fix verify — over-assert guard).
  expected_args:
    resolve_source: {library: serde, ecosystem: crates}
  oracle: {type: structural}

- id: explicit-lookup-shadow-gh-en
  # Same-name shadowing: npm package `gh` exists, so the Package shape wins
  # deterministically over CLI introspection (issue #38 同名遮蔽 requirement).
  prompt: "/livedocs:look-up gh"
  lang: en
  category: explicit
  expected_trigger: true
  expected_tools: [resolve_source, fetch_docs]
  oracle: {type: structural}

- id: explicit-lookup-noargs-en
  prompt: "/livedocs:look-up"
  lang: en
  category: explicit
  expected_trigger: false
  expected_tools: []
  oracle: {type: none}
